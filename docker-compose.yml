version: '3.8'

services:
  pharmatrust-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmatrust-platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
      - USE_MOCK_LEDGER=true
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-AIzaSyADGlc79fkUlpVN0SuU8EQ_mYwQL3QaAXg}
      - JWT_SECRET=4f9b8c2d1e0a7f5b3c8e1d2a4f6b8c0e2d4a6f8b0c2e4a6f8b0c2e4a6f8b0c2e
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
